name: Pruebas de Java 21 y fase 2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar sin advertencias y ejecutar las ocho suites
        shell: bash
        run: |
          mkdir -p out
          git ls-files -- '*.java' > fuentes.txt
          javac --release 21 -encoding UTF-8 -Xlint:all -Werror -d out @fuentes.txt
          for suite in symbol_table.PruebaTablaSimbolos PruebaFase1 PruebaParserDDL PruebaFase2 PruebaAnalizadorDML PruebaSemanticaDDL PruebaSemanticaDML PruebaDelimitadores; do
            java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8 -cp out "$suite"
          done
